name: Feature request
description: Suggest a new workflow, integration, or onboarding capability.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What adoption or ROI challenge should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the user experience and expected outcome.
    validations:
      required: true
